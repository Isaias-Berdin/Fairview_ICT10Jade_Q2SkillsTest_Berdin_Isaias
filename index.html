<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Q2 Skills Test</title>
    <style>
        body {
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            background-image: url(https://i.pinimg.com/736x/d4/75/bd/d475bd66f11eb3e72a5874115912264e.jpg);
        }
        #formbg {
            background-color: wheat;
        }
        h1 {
            border: 5px solid rgb(86, 68, 29);
            background-color: rgb(239, 218, 164);
            box-shadow: 0px 5px 5px rgb(0, 0, 0);
            height: 50px;
            border-radius: 10px;
        }
        #output1 {
            background-color: wheat;
        }
        #button {
            color: rgb(86, 68, 29);
        }
    </style>
</head>

<body>
<center>
    <br><br><br>
    <h1 class="justify-content-top"><b>Non-Metal Periodic Table Searcher</b></h1>
    <br><br>
    <div class="container justify-content-center" id="formbg">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <form>
                    <label for="symbol">Enter a NONMETAL Element Symbol:</label>
                    <br>
                    <input type="text" id="symbol" class="form-control">
                    <br>
                    <button type="button" class="btn" id="button" py-click="verify_element">Search</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-lg-5" id="output1">
        <script type="py" src="main.py"></script>
    </div>
    
</body>
</center>

</html>
